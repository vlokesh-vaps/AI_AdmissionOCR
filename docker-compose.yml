services:
  aiocr:
    build: .
    container_name: aiocr
    env_file:
      - .env
    ports:
      - "5007:5007"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5007/docs')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
